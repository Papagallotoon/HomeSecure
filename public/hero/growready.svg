<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400">
  <circle cx="240" cy="200" r="175" fill="#e4f2d3"/>

  <!-- sun -->
  <circle cx="380" cy="90" r="34" fill="#f6d386" opacity="0.85"/>
  <g stroke="#f2b544" stroke-width="4" stroke-linecap="round">
    <line x1="380" y1="30" x2="380" y2="18"/>
    <line x1="380" y1="150" x2="380" y2="162"/>
    <line x1="320" y1="90" x2="308" y2="90"/>
    <line x1="440" y1="90" x2="452" y2="90"/>
  </g>

  <!-- pot -->
  <path d="M175 260h130l-14 90a10 10 0 0 1-10 8h-82a10 10 0 0 1-10-8l-14-90Z" fill="#c8815c"/>
  <rect x="165" y="245" width="150" height="22" rx="8" fill="#a8663f"/>

  <!-- leaves / plant -->
  <path d="M240 250c0-46-34-70-62-84 18 34 32 58 62 84Z" fill="#4a8024"/>
  <path d="M240 250c0-52 40-78 70-92-16 40-34 66-70 92Z" fill="#7ebd47"/>
  <path d="M240 250c-6-38 2-64 10-88 10 34 8 60-10 88Z" fill="#a3d474"/>

  <!-- badge: leaf -->
  <circle cx="90" cy="150" r="30" fill="#ffffff" stroke="#c8e6a8" stroke-width="2"/>
  <path d="M100 134s-14-1-21 8-4 21-4 21 14 1 21-8 4-21 4-21Z" fill="none" stroke="#4a8024" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- badge: droplet -->
  <circle cx="400" cy="240" r="30" fill="#ffffff" stroke="#c8e6a8" stroke-width="2"/>
  <path d="M400 226s8 9 8 15a8 8 0 1 1-16 0c0-6 8-15 8-15Z" fill="none" stroke="#4a8024" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- badge: seed -->
  <circle cx="86" cy="290" r="28" fill="#ffffff" stroke="#c8e6a8" stroke-width="2"/>
  <path d="M86 304c-10 0-18-8-18-18 0-13 18-24 18-24s18 11 18 24c0 10-8 18-18 18Z" fill="none" stroke="#4a8024" stroke-width="2" stroke-linejoin="round"/>

  <!-- ground line -->
  <line x1="90" y1="358" x2="390" y2="358" stroke="#c8e6a8" stroke-width="2" stroke-linecap="round"/>
</svg>
